<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — Smart Energy Load Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background: #faf9f7;
      color: #1a1a18;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1f9d55, #146633);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 { font-size: 1.25rem; margin: 0; }
    p { color: rgba(0,0,0,0.5); margin: 0; max-width: 26rem; }
    button {
      margin-top: 0.5rem;
      padding: 0.6rem 1.25rem;
      border-radius: 0.5rem;
      border: none;
      background: #18813f;
      color: white;
      font-size: 0.9rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">⚡</div>
  <h1>You're offline</h1>
  <p>The app shell loaded from cache, but load calculations, bills, and sizing all need a live connection. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
